<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memória Histórica</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Georgia, serif;
    background: #171717;
    color: #eee;
}

header {
    text-align: center;
    padding: 55px 20px;
    background: #252525;
    border-bottom: 2px solid #9b7953;
}

header h1 {
    color: #d4b58c;
    font-size: 38px;
}

header p {
    color: #bbb;
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 30px 20px;
}

h2 {
    color: #d4b58c;
    text-align: center;
}

.caixas {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-top: 30px;
}

.caixa {
    background: #292929;
    border: 1px solid #70583e;
    padding: 25px;
    min-height: 140px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
}

.caixa:hover {
    background: #39312a;
    transform: translateY(-4px);
}

.caixa h3 {
    color: #d4b58c;
}

.caixa p {
    color: #bbb;
}

#artigo {
    display: none;
    background: #252525;
    padding: 25px;
    margin-top: 35px;
    border-radius: 8px;
    border: 1px solid #9b7953;
}

#artigo h2 {
    text-align: left;
}

#textoArtigo {
    white-space: pre-wrap;
    line-height: 1.8;
}

#imagemArtigo {
    max-width: 100%;
    max-height: 400px;
    display: none;
    margin: 20px auto;
    border-radius: 8px;
}

button {
    background: #9b7953;
    color: white;
    border: none;
    padding: 11px 18px;
    margin: 8px 5px 8px 0;
    cursor: pointer;
    border-radius: 5px;
}

button:hover {
    background: #765b3c;
}

.editor {
    display: none;
    margin-top: 25px;
    border-top: 1px solid #70583e;
    padding-top: 20px;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin: 8px 0 18px;
    background: #171717;
    color: white;
    border: 1px solid #70583e;
    border-radius: 5px;
    font-family: Arial, sans-serif;
}

textarea {
    min-height: 250px;
    resize: vertical;
}

label {
    color: #d4b58c;
}

footer {
    text-align: center;
    padding: 25px;
    color: #888;
    margin-top: 50px;
}
</style>
</head>

<body>

<header>
    <h1>Memória Histórica</h1>
    <p>Conhecer o passado para compreender o presente.</p>
</header>

<main>

<h2>Épocas Históricas</h2>
<p style="text-align:center;color:#aaa;">
    Escolhe um tema para consultar a sua história.
</p>

<div class="caixas" id="caixas"></div>

<section id="artigo">

    <h2 id="tituloArtigo"></h2>

    <img id="imagemArtigo" alt="Imagem do artigo">

    <p id="textoArtigo"></p>

    <button onclick="abrirEditor()">Editar artigo</button>
    <button onclick="fecharArtigo()">Voltar aos temas</button>

    <div class="editor" id="editor">

        <h2>Editar conteúdo</h2>

        <label>Título</label>
        <input type="text" id="campoTitulo">

        <label>Pequena descrição</label>
        <input type="text" id="campoResumo">

        <label>Link da imagem</label>
        <input type="text" id="campoImagem"
        placeholder="Coloca aqui o link da imagem">

        <label>Texto da história</label>
        <textarea id="campoTexto"
        placeholder="Escreve aqui a informação histórica..."></textarea>

        <button onclick="guardarArtigo()">Guardar alterações</button>
        <button onclick="cancelarEdicao()">Cancelar</button>

    </div>
</section>

</main>

<footer>
    Memória Histórica © 2026
</footer>

<script>

const temasIniciais = [
    "1.ª Dinastia — Borgonha",
    "2.ª Dinastia — Avis",
    "3.ª Dinastia — Filipina",
    "4.ª Dinastia — Bragança",
    "Estado Novo",
    "25 de Abril",
    "Primeira Guerra Mundial",
    "Segunda Guerra Mundial"
];

let artigos = JSON.parse(localStorage.getItem("artigosHistoria")) || {};

let temaAtual = "";

function mostrarCaixas() {

    const caixas = document.getElementById("caixas");
    caixas.innerHTML = "";

    temasIniciais.forEach(tema => {

        const artigo = artigos[tema] || {
            titulo: tema,
            resumo: "Clica para escrever e consultar este tema."
        };

        const caixa = document.createElement("div");
        caixa.className = "caixa";

        const titulo = document.createElement("h3");
        titulo.textContent = artigo.titulo;

        const resumo = document.createElement("p");
        resumo.textContent = artigo.resumo;

        caixa.appendChild(titulo);
        caixa.appendChild(resumo);

        caixa.addEventListener("click", () => abrirArtigo(tema));

        caixas.appendChild(caixa);
    });
}

function abrirArtigo(tema) {

    temaAtual = tema;

    const artigo = artigos[tema] || {
        titulo: tema,
        resumo: "",
        texto: "",
        imagem: ""
    };

    document.getElementById("tituloArtigo").textContent = artigo.titulo;
    document.getElementById("textoArtigo").textContent =
        artigo.texto || "Ainda não existe informação neste artigo.";

    const imagem = document.getElementById("imagemArtigo");

    if (artigo.imagem) {
        imagem.src = artigo.imagem;
        imagem.style.display = "block";
    } else {
        imagem.style.display = "none";
    }

    document.getElementById("artigo").style.display = "block";
    document.getElementById("editor").style.display = "none";

    document.getElementById("artigo").scrollIntoView({
        behavior: "smooth"
    });
}

function abrirEditor() {

    const artigo = artigos[temaAtual] || {
        titulo: temaAtual,
        resumo: "",
        texto: "",
        imagem: ""
    };

    document.getElementById("campoTitulo").value = artigo.titulo;
    document.getElementById("campoResumo").value = artigo.resumo;
    document.getElementById("campoTexto").value = artigo.texto;
    document.getElementById("campoImagem").value = artigo.imagem;

    document.getElementById("editor").style.display = "block";
}

function guardarArtigo() {

    artigos[temaAtual] = {
        titulo: document.getElementById("campoTitulo").value,
        resumo: document.getElementById("campoResumo").value,
        texto: document.getElementById("campoTexto").value,
        imagem: document.getElementById("campoImagem").value
    };

    localStorage.setItem("artigosHistoria", JSON.stringify(artigos));

    mostrarCaixas();
    abrirArtigo(temaAtual);

    alert("Artigo guardado neste navegador!");
}

function cancelarEdicao() {
    document.getElementById("editor").style.display = "none";
}

function fecharArtigo() {
    document.getElementById("artigo").style.display = "none";
}

mostrarCaixas();

</script>

</body>
</html>
